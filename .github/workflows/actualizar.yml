name: Actualizar listas m3u
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar listas
        run: |
          curl -sL "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes.m3u" -o lista1.m3u
          curl -sL "https://tokyo.elcano-ipfs.workers.dev/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_iptv.m3u" -o lista2.m3u
      - name: Preparar payload
        run: jq -n --rawfile c1 lista1.m3u --rawfile c2 lista2.m3u '{files: {"lista1.m3u": {content: $c1}, "lista2.m3u": {content: $c2}}}' > payload.json
      - name: Subir al gist secreto
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 60db876e7bd1d4de62acbbb4072d194d
        run: |
          curl -s -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/$GIST_ID \
            -d @payload.json

