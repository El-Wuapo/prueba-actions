name: Actualizar listas m3u

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar listas
        run: |
          # Intentamos primero con la red oficial de IPFS (gateway de Cloudflare sin bloqueo o dweb.link)
          HASH1="k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
          HASH2="k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr"

          echo "Descargando lista 1..."
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-time 30 "https://cloudflare-ipfs.com/ipns/$HASH1/hashes.m3u" -o lista1.m3u || true
          
          # Si falla la primera, probamos con otra pasarela pública
          if ! head -c 20 "lista1.m3u" 2>/dev/null | grep -q "#EXTM3U"; then
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --max-time 30 "https://dweb.link/ipns/$HASH1/hashes.m3u" -o lista1.m3u || true
          fi

          echo "Descargando lista 2..."
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-time 30 "https://cloudflare-ipfs.com/ipns/$HASH2/hashes.m3u" -o lista2.m3u || true

          if ! head -c 20 "lista2.m3u" 2>/dev/null | grep -q "#EXTM3U"; then
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --max-time 30 "https://dweb.link/ipns/$HASH2/hashes.m3u" -o lista2.m3u || true
          fi

      - name: Construir payload solo con listas válidas
        run: |
          echo '{"files":{}}' > payload.json
          for f in lista1 lista2; do
            if head -c 20 "$f.m3u" 2>/dev/null | grep -q "#EXTM3U"; then
              jq --arg name "$f.m3u" --rawfile content "$f.m3u" '.files[$name] = {content: $content}' payload.json > tmp.json && mv tmp.json payload.json
              echo "OK: $f.m3u procesado correctamente."
            else
              echo "Aviso: $f.m3u no contiene la cabecera válida, se omite para no romper el Gist."
            fi
          done

      - name: Subir al gist solo si hay algo válido
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 60db876e7bd1d4de62acbbb4072d194d
        run: |
          if [ "$(jq '.files | length' payload.json)" -gt 0 ]; then
            curl -s -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/gists/$GIST_ID \
              -d @payload.json
            echo "Gist actualizado con éxito."
          else
            echo "Nada válido esta vez, se conserva el gist tal cual estaba."
          fi
