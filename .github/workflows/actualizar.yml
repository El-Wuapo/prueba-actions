name: Actualizar listas m3u

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar listas
        run: |
          # URLs completas apuntando directamente al archivo .m3u final
          URL1="https://ipfs.bytokyo.dpdns.org/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes.m3u"
          URL2="https://ipfs2.bytokyo.dpdns.org/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes.m3u"

          echo "Descargando lista 1..."
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            "$URL1" -o lista1.m3u || true

          echo "Descargando lista 2..."
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            "$URL2" -o lista2.m3u || true

      - name: Construir payload flexible
        run: |
          echo '{"files":{}}' > payload.json
          for f in lista1 lista2; do
            # Comprobamos que el archivo existe y no está vacío (tamaño > 0 bytes)
            if [ -s "$f.m3u" ]; then
              jq --arg name "$f.m3u" --rawfile content "$f.m3u" '.files[$name] = {content: $content}' payload.json > tmp.json && mv tmp.json payload.json
              echo "OK: $f.m3u añadido al payload correctamente."
            else
              echo "Aviso: $f.m3u está vacío o la descarga falló."
            fi
          done

      - name: Subir al gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 60db876e7bd1d4de62acbbb4072d194d
        run: |
          if [ "$(jq '.files | length' payload.json)" -gt 0 ]; then
            curl -s -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/gists/$GIST_ID \
              -d @payload.json
            echo "Gist actualizado con éxito."
          else
            echo "Nada para actualizar, se conserva el Gist anterior."
          fi
